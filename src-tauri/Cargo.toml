[package]
name = "musico-tauri"
version = "0.2.0"
edition = "2021"
rust-version = "1.78"
description = "Tauri shell for Musico — neumorphic music player"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
musico_playback = { path = "../musico_playback" }
musico_recommender = { path = "../musico_recommender" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
walkdir = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
